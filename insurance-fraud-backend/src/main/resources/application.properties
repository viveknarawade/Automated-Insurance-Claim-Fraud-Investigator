spring.config.import=optional:file:.env[.properties]

spring.application.name=insurance-fraud-backend
server.port = ${SERVER_PORT:8081}
server.address=0.0.0.0

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# mail config
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.org.apache.commons.mail=DEBUG


#SECURITY CONFIG
#spring.security.user.name =Vivek
#spring.security.user.password=123


# JWT
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:15m}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:7d}

#FILE UPLOAD CONFIG
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local development folder
file.upload-dir=./images

# STORAGE PROVIDER (local or cloudinary)
storage.provider=${STORAGE_PROVIDER:local}

